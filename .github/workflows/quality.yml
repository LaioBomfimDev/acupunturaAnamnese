name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      VITE_APP_RELEASE: ci-${{ github.sha }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Verificar invariantes de segurança
        run: npm run check:security

      - name: Lint
        run: npm run lint

      - name: Testes de regressão
        run: npm run test

      - name: Build de produção
        run: npm run build

      - name: Budget do bundle
        run: npm run check:bundle

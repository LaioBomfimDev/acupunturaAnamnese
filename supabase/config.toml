# Esta função é chamada antes de existir uma sessão. A autenticação da
# credencial e os limites persistentes continuam dentro do próprio handler.
[functions.login-with-identifier]
verify_jwt = false

# Pesquisa de satisfação: paciente responde sem login nenhum (link
# público). Sem isso o gateway recusaria toda chamada com 401 antes do
# handler rodar — a validação de token continua 100% dentro da function.
[functions.satisfaction-survey]
verify_jwt = false

# Confirmação de agendamento: mesmo motivo de satisfaction-survey — link
# pessoal que o paciente abre sem conta nenhuma.
[functions.confirm-appointment]
verify_jwt = false

# Agenda pública: link somente leitura gerado pelo botão Compartilhar,
# aberto sem conta pelo destinatário (WhatsApp, e-mail etc.).
[functions.public-agenda]
verify_jwt = false

# Área do Paciente: o paciente entra com código + data de nascimento e
# não tem conta no Supabase Auth. Sessão, bloqueio por tentativas e
# limites persistentes ficam dentro do handler (patient-portal/index.ts).
[functions.patient-portal]
verify_jwt = false

# Link de entrevista: quem convive com o paciente responde sem conta. O
# token do link e os limites persistentes ficam dentro do handler
# (interview-link/index.ts).
[functions.interview-link]
verify_jwt = false

# Consulta online: o paciente entra pelo link do agendamento, sem conta.
# O lado de quem atende valida o JWT e os bloqueios de conta dentro do
# handler (online-consultation/index.ts).
[functions.online-consultation]
verify_jwt = false

# Funções com login (ACUP-022, KEYS-1, 09/11/2026): com a chave publishable
# nova (sb_publishable_, não é JWT) o gateway com verify_jwt barraria antes
# do código. A sessão continua conferida DENTRO de cada handler
# (getCallerProfile + assertEdgeAccess); edge-supabase-keys.test.mjs falha
# se uma função sem verify_jwt não conferir a sessão nem for pública da lista.
[functions.analyze-tongue]
verify_jwt = false

